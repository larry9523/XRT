# To drop into a bash shell within the container:
#   docker-compose run --rm xrt-ipu bash
# To rebuild after Dockerfile changes:
#   docker-compose build
# To stop all containers associated with this project:
#   docker-compose down
# To build xrt-ipu in docker container:
#   docker-compose run --rm xrt-ipu 

#If running the docker container from command line, please source setEnvUser.sh script to set the User environment variables
#source build/docker/setEncUser.sh

version: "3.3"
services:
  xrt-ipu-ubuntu1804:   
    network_mode: bridge        
    build:      
      args:
        ## These arguments will default to xbuild, but you can add your user in         
        # one of two ways.     
        # 1. For per project setup, add a .env file at the root of this project e.g.   
        #    cp example.env .env && vi .env < docker-compose reads .env 
        # 2. Set these environment variables per user with .bashrc or .cshrc   
        #    but most of the time these variables will already be set for you. 
        # NOTE: These variables are read at build-time and at run-time
        USER_ID: ${XDOCK_UID}    
        USER_NAME: ${XDOCK_USER}        
        GROUP_ID: ${XDOCK_GID}   
        GROUP_NAME: ${XDOCK_GROUP}  
      context: .        
      dockerfile: Dockerfile-ubuntu18.04        
    image: "xrt-ipu-ubuntu1804:latest"  
    volumes:
      # We mount the current project to /app
      - ../../:/opt/xrt-ipu:rshared     
    user: ${XDOCK_USER:-xbuild} 
    working_dir: /opt/xrt-ipu   
    environment:
      - BUILD_XLNX      
      - BUILD_NUMBER    
      - XRT_VERSION_PATCH=${BUILD_NUMBER}       
      - NFSPATH=${PWD}  
      - AUTH_TOKEN      
      - USER    
      - DEBREPOKEY
      - WINREPOKEY  
      - ARTIFACTORYSERVER       
      - RDI_ROOT=/opt/xrt-ipu/buildubuntu1804   
      - GRADLE_USER_HOME=/tmp/gradleubuntu1804  
      - REL_DIR=Release_ubuntu1804      
      - DEBUG_DIR=Debug_ubuntu1804      
    command: ./build.sh

  xrt-ipu-centos76:
    network_mode: bridge
    build:
      args:
        ## These arguments will default to xbuild, but you can add your user in 
        # one of two ways.
        # 1. For per project setup, add a .env file at the root of this project e.g.
        #   cp example.env .env && vi .env < docker-compose reads .env
        # 2. Set these environment variables per user with .bashrc or .cshrc
        #    but most of the time these variables will already be set for you.
        # NOTE: These variables are read at build-time and at run-time
        USER_ID: ${XDOCK_UID}
        USER_NAME: ${XDOCK_USER}
        GROUP_ID: ${XDOCK_GID}
        GROUP_NAME: ${XDOCK_GROUP}
      context: .
      dockerfile: Dockerfile-centos7.6
    image: "xrt-ipu-centos76:latest"
    volumes:
      - /proj:/proj:shared
      # We mount the current project to /app
      - ../../:/opt/xrt-ipu:rshared
    user: ${XDOCK_USER}
    working_dir: /opt/xrt-ipu
    environment:
      - BUILD_XLNX
      - BUILD_NUMBER
      - XRT_VERSION_PATCH=${BUILD_NUMBER}
      - NFSPATH=${PWD}
      - AUTH_TOKEN
      - USER
      - RPMREPOKEY
      - WINREPOKEY
      - ARTIFACTORYSERVER
      - RDI_ROOT=/opt/xrt-ipu/buildcentos76
      - GRADLE_USER_HOME=/tmp/gradlecentos76
      - REL_DIR=Release_centos76
      - DEBUG_DIR=Debug_centos76
    command: ["./build.sh -noctest"]

