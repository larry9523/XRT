import groovy.io.FileType
import groovy.json.JsonSlurper

plugins {
    id "maven-publish"
    id "base"
    id "com.jfrog.artifactory" version "4.10.0" // Allow Jenkins to inject credentials, as well as control the repo
    id "com.xilinx.infra.prep-product" version "1.6.0" apply false
    id "com.xilinx.infra.manifest"
}

ext {
    release = infraCore.getRelease().get()
    trimmedRelease = release.endsWith('.0') ? release.substring(0, release.length()-2) : release
    buildNumber = infraCore.getBuildNumber().get()
    startTime = new Date().format('yyyyMMdd_HHmmss')
    wsRootDir = project.hasProperty('wsRootDir') ? project.wsRootDir.toString() : (System.getenv("WS_ROOT_DIR") ?: projectDir.absolutePath)
    if (!wsRootDir) {
        throw new GradleException("wsRootDir is a required parameter, pass it as -PwsRootDir or by setting env variable WS_ROOT_DIR; -PwsRootDir takes precedence")
    }
    logger.info("wsRootDir is set as ${wsRootDir}")

    branch = project.hasProperty('branch') ? project.branch.toString() : infraCore.branchParameters.get('config.branch')
    if (!branch) {
        throw new GradleException("could not deutermine branch, either pass it as -Pbranch or by setting branch value in branch.json; -Pbranch takes precedence")
    }
    logger.info("branch is set as ${branch}")
    taUsed = System.getenv().getOrDefault("TA", "/proj/xbuilds/${branch}_daily_latest")
    release = project.hasProperty('release') ? project.release.toString() : infraCore.branchParameters.get('config.release')

    artifactoryUpload = System.getenv("IS_CI") ? infraCore.branchParameters.get('config.package_servers.proxy') : 'http://xcort20:5000/upload'
    artifactoryServer = System.getenv("IS_CI") ? infraCore.branchParameters.get('config.package_servers.upload') : 'https://xcoartifactory'
    //artifactoryAuthToken = System.getenv("IS_CI") ? System.getenv("AUTH_TOKEN"): 'AKCp8jQTbFVVsDGArETGEFVP1TQamFhM272WSATCJyn4k9BJ5vakWHr1kfvBHzmxMdcgu4WcA'
    artifactoryUser = System.getenv().getOrDefault("USER", 'xbuild')
    artifactoryAuthToken = System.getenv("AUTH_TOKEN")
    rpmRepoKey = System.getenv("IS_CI") ? 'xrt-ipu-rpm-prod-local' : 'xrt-ipu-rpm-dev-local'
    debRepoKey = System.getenv("IS_CI") ? 'xrt-ipu-deb-prod-local' : 'xrt-ipu-deb-dev-local'
}


String getCentOsVer(fname){
    String ret = null
    if (fname.contains("_9.") || fname.contains("-9.")){
        ret = "9"
    } else if (fname.contains("_8.") || fname.contains("-8.")){
        ret = "8"
    }else if (fname.contains("_7.") || fname.contains("-7.")){
        ret = "7"
    }else if (fname.contains("_6.") || fname.contains("-6.")){
        ret = "6"
    }
    return ret
}


String getRpmArch(fname){
    String arch = null
    if (fname.contains("amd64") || fname.contains("x86")){
        arch = "x86_64"
     } else if (fname.contains("ppc64el")){
        arch = "ppc64le"
     }
     return arch
}

String getDebArch(fname){
    String arch = null
    if (fname.contains("arm64")){
        arch = "arm64"
    } else if (fname.contains("ppc64el")){
        arch = "ppc64le"
    }else if (fname.contains("amd64")){
        arch = "amd64"
    }
    return arch
}

String getDebDistro(fname){
    String distro = null
    if (fname.contains("_18.04")){
        distro = "bionic"
    } else if (fname.contains("_16.04")){
        distro = "xenial"
    }else {
        distro = "focal"
    }
    return distro
}


version = "${release}-${buildNumber}"
group 'com.xilinx'

// Data to be published in manifest file
coreManifest {
    // manifestReleaseRepo = "aie-ipu-dev-local"
    artifactNfsLocation = wsRootDir
    customManifestFields.put('buildNumber', buildNumber)
    customManifestFields.put('version', version)
    customManifestFields.put('TA', taUsed)
}

// extractManifest task gets the latest from artifactory.
dependencies {
    implementation "com.xilinx:xrt-ipu:${release}-+"
}

// Task to build IPU repo
tasks.register('buildXRT'){
  description 'Execute XRT-IPU build.'
  doFirst {
    exec {
      workingDir "$wsRootDir/../../src/runtime_src/tools/scripts/"
      commandLine 'sudo', './xrtdeps.sh', '-docker'
    }
    exec {
      workingDir "$wsRootDir/.."
      commandLine './build.sh'
    }
  }
}

// Cleanup build directory
tasks.register('cleanXRT', Exec) {
  description 'Clean up build directory.'
  doFirst {
    workingDir "$wsRootDir/.."
    println 'Cleaning up build directory'
    commandLine './build.sh', '-clean'
  }
}


// Publish rpm files to artifactory
task publishRpm {
  description 'Publish rpm files to artifactory using upload service'
  doFirst {
    def rpmKey = "rpmFiles"
    def rpmFileList = []
    def nfsPath = System.getenv("NFSPATH")
    def releaseDir = System.getenv("REL_DIR")
    def getRpmFiles = fileTree(include:['**/*.rpm'], dir:"$wsRootDir/../"+releaseDir)
    def wsRootDirs = wsRootDir.tokenize('/')
    def nfsPaths = nfsPath.tokenize('/')
    wsRootDirs.removeLast()
    nfsPaths.removeLast()
    wsRootDir = wsRootDirs.join('/')
    nfsPath = nfsPaths.join('/')

    getRpmFiles.each {
      rpmFileList.add(it['absolutePath'].replaceAll(wsRootDir, nfsPath))
    }

    rpmFileList.each {
      def fileName = it.tokenize('/')[-1]
      def centOsVer = getCentOsVer(fileName)
      def arch = getRpmArch(fileName)
      def command = "curl -u%s:%s -k -XPUT %s/artifactory/%s/%s/%s/"+fileName+" -T %s"
      def curlCommand = String.format(command, artifactoryUser,artifactoryAuthToken,artifactoryServer,rpmRepoKey, arch, centOsVer, it)
      println(curlCommand)
      ProcessBuilder builder = new ProcessBuilder(curlCommand.split(' '));
      Process process = builder.start();
      process.waitFor()
      println process.err.text
      println process.text
    }

}

// Publish debian files to artifactory
task publishDeb {
  description 'Publish debian files to artifactory using upload service'
  doFirst {
    def debKey = "debFiles"
    def debFileList = []
    def nfsPath = System.getenv("NFSPATH")
    def releaseDir = System.getenv("REL_DIR")
    def getDebFiles = fileTree(include:['**/*.deb'], dir:"$wsRootDir/../"+releaseDir)
    def wsRootDirs = wsRootDir.tokenize('/')
    def nfsPaths = nfsPath.tokenize('/')
    wsRootDirs.removeLast()
    nfsPaths.removeLast()
    wsRootDir = wsRootDirs.join('/')
    nfsPath = nfsPaths.join('/')

    getDebFiles.each {
      debFileList.add(it['absolutePath'].replaceAll(wsRootDir, nfsPath))
    }

    debFileList.each {
      def fileName = it.tokenize('/')[-1]
      def debDistro = getDebDistro(fileName)
      def debArch = getDebArch(fileName)
      def command = 'curl -u%s:%s -k -XPUT %s/artifactory/%s/pool/%s;deb.distribution=%s;deb.component=main;deb.architecture=%s -T %s'
      def curlCommand = String.format(command, artifactoryUser,artifactoryAuthToken, artifactoryServer,debRepoKey, fileName, debDistro, debArch, it)
      println(curlCommand)
      ProcessBuilder builder = new ProcessBuilder(curlCommand.split(' '));
      Process process = builder.start();
      process.waitFor()
      println process.err.text
      println process.text
    }


  }
}
}
